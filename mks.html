<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitation Card</Welcome to website>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff3e0, #ffe0b2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    h1 {
      color: #d2691e;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .details {
      font-weight: bold;
      color: #333;
      margin-top: 15px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #d2691e;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You’re Invited!</h1>
    <p>Please join us for a special celebration filled with joy, laughter, and wonderful memories.</p>
    <div class="details">Date: 15 August 2026<br />Time: 6:00 PM<br />Venue: Rose Garden Hall</div>
    <a href="#" class="btn">RSVP Now</a>
  </div>
</body>
</html>
