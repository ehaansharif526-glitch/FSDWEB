<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Form</title>
        <link rel="stylesheet2" href="reg.css">
    </head>
    <body>
        <h2>Student Registration form </h2>
    <form>
        <label> First Name:</label><br>
        <input type="text" id="fname" required><br><br>

        <label> Last Name:</label><br>
        <input type="text" id="lname" required><br><br>

        <label> Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label> Password:</label><br>
        <input type="password" id="password" required><br><br>

         <label>Age:</label><br>
         <input type="text" name="age"  value = ""><br><br>

         <lebel>Select sem</lebel><br>
         <select id="select sem">
            <option>1st sem</option>
             <option>2nd sem</option>
             <option>3rd sem</option>
             <option>4th sem</option>
             <option>5th sem</option>
             <option>6th sem</option>
              </select>
            <br><br>





        <label>Gender</label><br>
         <input type="radio" name="gender" value="Male" checked> Male
         <input type="radio" name="gender" value="Female" checked> Female
         <br><br>

         <label>Registration No:</label><br>
         <input type="text" name="regno"><br><br>

         <lebel>District</lebel><br>
         <select id="district">
            <option>Bengaluru</option>
            <option>Bengaluru rural</option>
            <option>Hubali</option>
            <option>Davanagere</option>
            <option>Shivamogga</option>
            <option>Kolar</option>
            <option>Hassan</option>
            <option>Mangaluru</option>
            <option>Belagavi</option>
            <option>Tumakuru</option>
            <option>Haveri</option>
            <option>Chikkamagaluru</option>
            <option>Dharawada</option>
            <option>Chitradurga</option>
            </select>
            <br><br>

            <label>Message</label><br>
            <textarea id="messege" rows="5" cols="20"></textarea>

            <input type="checkbox" id="corrected">
            <label for="corrected">the above filled content is  corrected</label>
            <br><br>


         <input type="submit" value="Submit">
         <input type="reset" value="Reset">


    </form>

    </body>
</html>
